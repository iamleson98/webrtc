name: rtcd

# The Rust SFU service under compare/rtcd-rust/. Linux only: it is also where the recvmmsg/sendmmsg/GSO socket paths
# in rtcd-net actually run.

on:
  push:
    branches: [ master ]
    paths: [ 'compare/rtcd-rust/**', '.github/workflows/rtcd.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'compare/rtcd-rust/**', '.github/workflows/rtcd.yml' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compare/rtcd-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo fmt --all --check
      - name: Clippy
        run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compare/rtcd-rust
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: $GITHUB_WORKSPACE/scripts/ci-run.sh cargo test --workspace --no-fail-fast

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: docker build -t rtcd-rust compare/rtcd-rust
      - name: Start through the entrypoint and ask for the version
        run: |
          docker run -d --name rtcd -p 8045:8045 -e RTCD_ICE_HOST_OVERRIDE=127.0.0.1 rtcd-rust
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8045/version \
            || { docker logs rtcd; exit 1; }
          docker logs rtcd
